{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Fuel Planner Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #0f172a;
            background-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
            padding: 18px 24px;
            margin-bottom: 24px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
        }

        select,
        input {
            margin-top: 6px;
            min-width: 200px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            font-size: 1rem;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #status {
            min-height: 24px;
            font-size: 0.95rem;
            color: #475569;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 24px;
        }

        iframe {
            width: 100%;
            min-height: 520px;
            border: none;
            border-radius: 12px;
            background: #fff;
        }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .details h2 {
            margin-top: 0;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .metric {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 12px;
        }

        .metric span {
            display: block;
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric strong {
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th,
        td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header class="card">
        <h1>Fuel Planner Demo</h1>
        <p>Select a start and finish city to see the optimized route, refueling plan, and cost summary.</p>
        <form id="planner-form">
            <label>
                Start
                <input id="start-input" list="city-options" placeholder="City, State" required />
            </label>
            <label>
                Finish
                <input id="finish-input" list="city-options" placeholder="City, State" required />
            </label>
            <label>
                Max Range (mi)
                <input id="range-input" type="number" min="100" max="800" value="500" required />
            </label>
            <label>
                MPG
                <input id="mpg-input" type="number" min="5" max="60" value="10" required />
            </label>
            <button type="submit" id="plan-button">Plan Route</button>
        </form>
        <datalist id="city-options"></datalist>
        <div id="status"></div>
    </header>

    <main class="layout">
        <section>
            <iframe id="map-frame" title="Route map preview"></iframe>
        </section>

        <section class="card details">
            <h2>Trip Summary</h2>
            <div class="metric-grid" id="metric-grid"></div>

            <h3>Fuel Stops</h3>
            <div id="stops-table"></div>

            <h3>Segments</h3>
            <div id="segments-table"></div>
        </section>
    </main>

    <script>
        window.fuelPlannerDemoConfig = {
            endpoint: "{% url 'route-plan' %}",
            citiesEndpoint: "{% url 'city-list' %}"
        };
    </script>
    <script src="{% static 'planner/demo.js' %}" defer></script>
</body>
</html>
