# Render blueprint for the API: New > Blueprint > this repo. The database is
# on Neon; paste its connection string into DATABASE_URL when Render asks.
services:
  - type: web
    name: fuel-planner-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /api/health/
    autoDeploy: true
    branch: main
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # the Vercel site; set once its URL is known
      - key: CORS_ALLOWED_ORIGINS
        value: ""
